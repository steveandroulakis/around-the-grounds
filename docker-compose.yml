services:
  temporal-init:
    image: temporalio/temporal
    user: root
    entrypoint: ["sh", "-c", "chown -R temporal:temporal /data"]
    volumes:
      - temporal-data:/data

  temporal-server:
    image: temporalio/temporal
    command: server start-dev --ip 0.0.0.0 --db-filename /data/temporal.db
    ports:
      - "7233:7233"
      - "8233:8233"
    volumes:
      - temporal-data:/data
    restart: unless-stopped
    depends_on:
      temporal-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "temporal", "workflow", "list", "--address", "localhost:7233"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  temporal-worker:
    build: .
    container_name: around-the-grounds-worker
    environment:
      # Temporal Configuration (connects to temporal-server via Docker DNS)
      - TEMPORAL_ADDRESS=temporal-server:7233
      - TEMPORAL_NAMESPACE=default
      - TEMPORAL_TASK_QUEUE=${TEMPORAL_TASK_QUEUE:-food-truck-task-queue}

      # GitHub App Configuration
      - GITHUB_APP_ID=${GITHUB_APP_ID:-1531147}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-Iv23lihIZ0x4zfmWyUPe}
      - GITHUB_APP_PRIVATE_KEY_B64=${GITHUB_APP_PRIVATE_KEY_B64}

      # Claude Vision API
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - VISION_ANALYSIS_ENABLED=${VISION_ANALYSIS_ENABLED:-true}
      - VISION_MAX_RETRIES=${VISION_MAX_RETRIES:-2}
      - VISION_TIMEOUT=${VISION_TIMEOUT:-30}

      # Git Configuration
      - GIT_AUTHOR_NAME=steveandroulakis
      - GIT_AUTHOR_EMAIL=steve.androulakis@gmail.com
      - GIT_COMMITTER_NAME=steveandroulakis
      - GIT_COMMITTER_EMAIL=steve.androulakis@gmail.com

    depends_on:
      temporal-server:
        condition: service_healthy
    restart: unless-stopped

    # Health check
    healthcheck:
      test: ["CMD", "python", "-c", "import around_the_grounds.temporal.config; around_the_grounds.temporal.config.validate_configuration()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  temporal-data: